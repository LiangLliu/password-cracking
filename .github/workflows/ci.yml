name: CI

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (only for manual release)'
        required: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ========== 第一阶段：检查（所有推送都运行）==========

  # 代码质量检查
  quality-check:
    name: Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-quality-
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Validate package manifests
        run: bash scripts/test-package-manifests.sh

  # 安全审计
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # 测试
  test:
    name: Test - ${{ matrix.os }} / ${{ matrix.rust }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ matrix.rust }}-
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Run doc tests
        run: cargo test --doc --verbose

  # ========== 第二阶段：构建（仅在标签推送时运行）==========

  build:
    name: Build - ${{ matrix.name }}
    needs: [quality-check, security-audit, test]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-amd64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-amd64-musl
            nfpm_arch: amd64
            use-cross: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            use-cross: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: linux-arm64-musl
            nfpm_arch: arm64
            use-cross: true

          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            name: linux-armv7
            use-cross: true

          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            name: linux-armv7-musl
            nfpm_arch: armv7
            use-cross: true

          # macOS
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-amd64

          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Build (cargo)
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: ${{ matrix.use-cross }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Package Binary
        shell: bash
        run: |
          mkdir -p release
          # Keep README/LICENSE inside release/ so both GNU tar and BSD tar
          # store flat member names (BSD tar keeps a leading "../" verbatim,
          # which makes the archive unextractable by Homebrew).
          cp README.md LICENSE release/
          cp "target/${{ matrix.target }}/release/password-cracking" \
             "release/password-cracking"
          chmod +x "release/password-cracking"

      - name: Create Archive
        shell: bash
        run: |
          cd release
          ARCHIVE_NAME="password-cracking-${{ matrix.name }}"

          # Keep the binary name stable (`password-cracking`) so package
          # manifests (Homebrew, AUR) and install.sh stay simple.
          tar -czf "${ARCHIVE_NAME}.tar.gz" password-cracking README.md LICENSE
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          else
            sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          fi

      - name: Prepare Linux package contents
        if: matrix.nfpm_arch
        shell: bash
        run: |
          # man page/completions are architecture independent; build them with
          # a host binary because cross-compiled targets cannot execute here.
          cargo build --release
          HOST_BIN="target/release/password-cracking"
          mkdir -p release/pkg/completions
          cp "target/${{ matrix.target }}/release/password-cracking" release/pkg/password-cracking
          chmod +x release/pkg/password-cracking
          "$HOST_BIN" man > release/pkg/password-cracking.1
          "$HOST_BIN" completions bash > release/pkg/completions/password-cracking.bash
          "$HOST_BIN" completions zsh > release/pkg/completions/_password-cracking
          "$HOST_BIN" completions fish > release/pkg/completions/password-cracking.fish

      - name: Set up Go (nfpm)
        if: matrix.nfpm_arch
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build Linux packages (deb/rpm/apk)
        if: matrix.nfpm_arch
        shell: bash
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          GOPATH_BIN="$(go env GOPATH)/bin"
          export PATH="$PATH:$GOPATH_BIN"
          # Prefer the tag, but fall back to Cargo.toml for branch builds.
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            VERSION="$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)"
          fi
          export VERSION
          BASE_ARCH="${{ matrix.nfpm_arch }}"
          for packager in deb rpm apk; do
            # nfpm passes $ARCH through verbatim, but each format uses a
            # different name for 32-bit ARM.
            case "$packager:$BASE_ARCH" in
              deb:armv7) arch="armhf" ;;
              rpm:armv7) arch="armv7hl" ;;
              *) arch="$BASE_ARCH" ;;
            esac
            ARCH="$arch" nfpm package -f packaging/nfpm.yaml -p "$packager" -t release
          done
          for f in release/*.deb release/*.rpm release/*.apk; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: password-cracking-${{ matrix.name }}
          path: |
            release/*.tar.gz
            release/*.deb
            release/*.rpm
            release/*.apk
            release/*.sha256
          if-no-files-found: error
          retention-days: 7

  # ========== 第三阶段：发布（仅在标签推送时运行）==========

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Aggregate checksums
        run: |
          find artifacts -name '*.sha256' -type f -exec cat {} + > SHA256SUMS
          cp scripts/install.sh install.sh

      - name: Generate Release Notes
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")

          {
            echo "## 🎉 Password Cracking Tool Release $TAG"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### 📋 更新日志"
              echo ""
              git log --pretty=format:"- %s (%h)" "$PREV_TAG".."$TAG"
              echo ""
            else
              echo "首次发布！"
            fi
          } > RELEASE_NOTES.md

          cat >> RELEASE_NOTES.md << 'EOF'
          
          ### 📦 安装方式

          **Homebrew（macOS / Linux）**
          ```bash
          brew install LiangLliu/tap/password-cracking
          ```

          **APT（Debian / Ubuntu / 树莓派）**
          ```bash
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://lianglliu.github.io/password-cracking/key.gpg | sudo tee /etc/apt/keyrings/password-cracking.gpg > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/password-cracking.gpg] https://lianglliu.github.io/password-cracking stable main" | sudo tee /etc/apt/sources.list.d/password-cracking.list
          sudo apt update && sudo apt install password-cracking
          ```

          **Arch Linux（AUR）**
          ```bash
          yay -S password-cracking-bin
          ```

          **Docker**
          ```bash
          docker run --rm -v "$PWD:/data" ghcr.io/lianglliu/password-cracking --version
          ```

          **Rust（源码安装）**
          ```bash
          cargo install --git https://github.com/LiangLliu/password-cracking
          ```

          ### 📥 直接下载

          请根据您的操作系统和架构选择合适的版本：

          **Linux:**
          - `password-cracking-linux-amd64-musl.tar.gz`: x86_64 Linux（静态，推荐）
          - `password-cracking-linux-arm64-musl.tar.gz`: ARM64 Linux（静态）
          - `password-cracking-linux-armv7-musl.tar.gz`: 32 位 ARM（树莓派，静态）
          - `password-cracking-linux-amd64.tar.gz`: x86_64 glibc
          - `password-cracking-linux-arm64.tar.gz`: ARM64 glibc
          - `password-cracking-linux-armv7.tar.gz`: 32 位 ARM glibc

          **macOS:**
          - `password-cracking-macos-amd64.tar.gz`: 适用于 Intel Mac
          - `password-cracking-macos-arm64.tar.gz`: 适用于 Apple Silicon Mac

          ### 🔐 校验和

          每个文件都附带 `.sha256` 校验和文件，请验证文件完整性后使用。
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.apk
            artifacts/**/*.sha256
            SHA256SUMS
            install.sh
          fail_on_unmatched_files: true

  # ========== 第四阶段：分发（APT / Homebrew / AUR / GHCR / crates.io）==========

  publish:
    name: Publish packages
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: write
      packages: write
      pages: write
    secrets: inherit