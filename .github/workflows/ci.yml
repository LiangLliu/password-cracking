name: CI

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (only for manual release)'
        required: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ========== 第一阶段：检查（所有推送都运行）==========

  # 代码质量检查
  quality-check:
    name: Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-quality-
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

  # 安全审计
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # 测试
  test:
    name: Test - ${{ matrix.os }} / ${{ matrix.rust }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ matrix.rust }}-
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Run doc tests
        run: cargo test --doc --verbose

  # ========== 第二阶段：构建（仅在标签推送时运行）==========

  build:
    name: Build - ${{ matrix.name }}
    needs: [quality-check, security-audit, test]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-amd64
            nfpm_arch: amd64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            nfpm_arch: arm64
            use-cross: true

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-amd64-musl
            nfpm_arch: amd64
            use-cross: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: linux-arm64-musl
            nfpm_arch: arm64
            use-cross: true

          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            name: linux-armv7
            nfpm_arch: armv7
            use-cross: true

          # macOS
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-amd64

          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-amd64

          - os: windows-latest
            target: i686-pc-windows-msvc
            name: windows-i686

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Build (cargo)
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: ${{ matrix.use-cross }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Package Binary
        shell: bash
        run: |
          mkdir -p release
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/password-cracking.exe" \
               "release/password-cracking-${{ matrix.name }}.exe"
          else
            cp "target/${{ matrix.target }}/release/password-cracking" \
               "release/password-cracking-${{ matrix.name }}"
            chmod +x "release/password-cracking-${{ matrix.name }}"
          fi

      - name: Create Archive
        shell: bash
        run: |
          cd release
          ARCHIVE_NAME="password-cracking-${{ matrix.name }}"

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Windows - 创建 ZIP
            7z a "${ARCHIVE_NAME}.zip" "password-cracking-${{ matrix.name }}.exe" ../README.md
            sha256sum "${ARCHIVE_NAME}.zip" > "${ARCHIVE_NAME}.zip.sha256"
          else
            # Unix - 创建 tar.gz
            tar -czf "${ARCHIVE_NAME}.tar.gz" "password-cracking-${{ matrix.name }}" ../README.md
            if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
              shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
            else
              sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
            fi
          fi

      - name: Prepare Linux package contents
        if: matrix.nfpm_arch
        shell: bash
        run: |
          # man page/completions are architecture independent; build them with
          # a host binary because cross-compiled targets cannot execute here.
          cargo build --release
          HOST_BIN="target/release/password-cracking"
          mkdir -p release/pkg/completions
          cp "target/${{ matrix.target }}/release/password-cracking" release/pkg/password-cracking
          chmod +x release/pkg/password-cracking
          "$HOST_BIN" man > release/pkg/password-cracking.1
          "$HOST_BIN" completions bash > release/pkg/completions/password-cracking.bash
          "$HOST_BIN" completions zsh > release/pkg/completions/_password-cracking
          "$HOST_BIN" completions fish > release/pkg/completions/password-cracking.fish

      - name: Set up Go (nfpm)
        if: matrix.nfpm_arch
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build Linux packages (deb/rpm/apk)
        if: matrix.nfpm_arch
        shell: bash
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          export PATH="$PATH:$(go env GOPATH)/bin"
          # Prefer the tag, but fall back to Cargo.toml for branch builds.
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            VERSION="$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)"
          fi
          export VERSION
          export ARCH="${{ matrix.nfpm_arch }}"
          for packager in deb rpm apk; do
            nfpm package -f packaging/nfpm.yaml -p "$packager" -t release
          done
          for f in release/*.deb release/*.rpm release/*.apk; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: password-cracking-${{ matrix.name }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.deb
            release/*.rpm
            release/*.apk
            release/*.sha256
          if-no-files-found: error
          retention-days: 7

  # ========== 第三阶段：发布（仅在标签推送时运行）==========

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Aggregate checksums
        run: |
          find artifacts -name '*.sha256' -type f -exec cat {} + > SHA256SUMS
          cp scripts/install.sh install.sh

      - name: Generate Release Notes
        run: |
          TAG="${{ github.ref_name }}"
          echo "## 🎉 Password Cracking Tool Release $TAG" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          # 获取上一个标签
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "### 📋 更新日志" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            git log --pretty=format:"- %s (%h)" "$PREV_TAG".."$TAG" >> RELEASE_NOTES.md
          else
            echo "首次发布！" >> RELEASE_NOTES.md
          fi

          cat >> RELEASE_NOTES.md << 'EOF'
          
          ### 📥 下载说明
          
          请根据您的操作系统和架构选择合适的版本：
          
          **Linux:**
          - `password-cracking-linux-amd64.tar.gz`: 适用于 x86_64 Linux
          - `password-cracking-linux-arm64.tar.gz`: 适用于 ARM64 Linux
          - `password-cracking-linux-amd64-musl.tar.gz`: 适用于 Alpine Linux
          
          **macOS:**
          - `password-cracking-macos-amd64.tar.gz`: 适用于 Intel Mac
          - `password-cracking-macos-arm64.tar.gz`: 适用于 Apple Silicon Mac
          
          **Windows:**
          - `password-cracking-windows-amd64.zip`: 适用于 64 位 Windows
          - `password-cracking-windows-i686.zip`: 适用于 32 位 Windows
          
          ### 🔐 校验和
          
          每个文件都附带 `.sha256` 校验和文件，请验证文件完整性后使用。
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.apk
            artifacts/**/*.sha256
            SHA256SUMS
            install.sh
          fail_on_unmatched_files: true