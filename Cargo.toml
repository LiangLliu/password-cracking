[package]
name = "password-cracking"
version = "0.2.0"
edition = "2024"
description = "High-performance document password cracker"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4.6", features = ["derive", "cargo"] }

# Concurrency
rayon = "1.12"
crossbeam-channel = "0.5"
num_cpus = "1.17"

# Progress
indicatif = "0.18"

# Errors
anyhow = "1.0"

# ZIP
zip = { version = "8.6", default-features = false, features = ["aes-crypto", "deflate"] }

# Crypto: hashes
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"

# Crypto: ciphers
aes = "0.9"
cipher = { version = "0.5", features = ["alloc", "block-padding"] }

# OLE compound files (old Office .doc/.xls/.ppt)
cfb = "0.14"

# Memory-mapped files (large wordlists)
memmap2 = "0.9"

# Utils
base64 = "0.22"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[package.metadata.cargo-machete]
# md-5 is used via `md5::Md5` in src/formats/pdf.rs; machete misses it due to the
# crate rename (crate `md-5` -> use `md5`). It is a real dependency, not unused.
# memmap2 will be enabled in Phase 2 (wordlist streaming/mmap); ignored for now to
# keep pre-commit (cargo machete) quiet until then.
ignored = ["md-5", "memmap2"]

