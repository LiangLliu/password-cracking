[package]
name = "password-cracking"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "High-performance ZIP, PDF and Office password cracker"
license = "MIT"
authors = ["LiangLliu <max1141847753@gmail.com>"]
repository = "https://github.com/LiangLliu/password-cracking"
homepage = "https://github.com/LiangLliu/password-cracking"
documentation = "https://github.com/LiangLliu/password-cracking#readme"
readme = "README.md"
keywords = ["password", "cracker", "zip", "pdf", "office"]
categories = ["command-line-utilities", "cryptography"]
# Keep the published crate focused; the e2e tests still need examples/.
exclude = [
    ".github/",
    "docs/superpowers/",
    "packaging/",
    "scripts/",
    "wordlists/",
]

[dependencies]
# CLI
clap = { version = "4.6", features = ["derive", "cargo"] }
clap_complete = "4.6"
clap_mangen = "0.3"

# Concurrency
crossbeam-channel = "0.5"
num_cpus = "1.17"

# Progress
indicatif = "0.18"

# Errors
anyhow = "1.0"

# ZIP
zip = { version = "9.1", default-features = false, features = ["aes-crypto", "deflate"] }

# Crypto: hashes
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"

# Crypto: ciphers
aes = "0.9"
cipher = { version = "0.5", features = ["alloc", "block-padding"] }

# OLE compound files (old Office .doc/.xls/.ppt)
cfb = "0.15"

# Memory-mapped files (large wordlists)
memmap2 = "0.9"

# Utils
base64 = "0.23"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[package.metadata.cargo-machete]
# md-5 is used via `md5::Md5` in src/formats/pdf.rs; machete misses it due to the
# crate rename (crate `md-5` -> use `md5`). It is a real dependency, not unused.
ignored = ["md-5"]

